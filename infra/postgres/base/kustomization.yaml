# Lab stand-in for the database VMs. At RSSB the databases stay on their VMs
# in phase 1 (plan D5); apps reach them over the network exactly as they reach
# this in-cluster instance, through DATABASE_URL.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: lab-infra
    includeSelectors: false
resources:
  - statefulset.yaml
  - service.yaml
