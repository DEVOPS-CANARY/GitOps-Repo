# LAB ONLY: the stateful services the apps depend on, run in Docker on your
# machine, OUTSIDE the cluster, the way RSSB runs them on their own VMs.
# Pods reach them at host.minikube.internal:<port>, so app config looks the
# same as in RSSB (a database host outside Kubernetes).
#
# Don't run this directly: scripts/lab-services.sh passes in the passwords
# from team-secrets and creates one database per app per environment.
name: lab-services

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/lab-services.sh instead}
    ports:
      # 15432, not 5432: a native Postgres often already uses 5432.
      # LAB_BIND keeps it off the office network (set by scripts/lab-services.sh).
      - ${LAB_BIND:-127.0.0.1}:15432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine3.23@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    user: redis # the whole container, not just the server, runs unprivileged
    # Users live in /data/users.acl (password hashes only), written by
    # scripts/lab-services.sh from team-secrets. Until its first run, only the
    # default user exists, without a password, reachable on LAB_BIND only.
    command:
      - sh
      - -c
      - >-
        [ -f /data/users.acl ] || echo 'user default on nopass ~* &* +@all' > /data/users.acl;
        exec redis-server --aclfile /data/users.acl --appendonly yes
    ports:
      # 16379, not 6379, for the same reason as Postgres.
      - ${LAB_BIND:-127.0.0.1}:16379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      # Answers PONG before the users are loaded, NOAUTH after: both mean "up".
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  # Survive `docker compose down` and deleting the cluster; `down -v` wipes them.
  postgres-data:
  redis-data:
