# LAB ONLY: the stateful services the apps depend on, run in Docker on your
# machine, OUTSIDE the cluster, the way RSSB runs them on their own VMs.
# Pods reach them at host.minikube.internal:<port>, so app config looks the
# same as in RSSB (a database host outside Kubernetes).
#
# Don't run this directly: scripts/lab-services.sh passes in the passwords
# from team-secrets and creates one database per app per environment.
name: lab-services

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/lab-services.sh instead}
    ports:
      # 15432, not 5432: a native Postgres often already uses 5432.
      # LAB_BIND keeps it off the office network (set by scripts/lab-services.sh).
      - ${LAB_BIND:-127.0.0.1}:15432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  # Survives `docker compose down` and deleting the cluster; `down -v` wipes it.
  postgres-data:
