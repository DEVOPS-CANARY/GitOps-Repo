# Platform components that every app relies on, deployed by Argo CD like the
# apps, but fenced by their own project: they may create cluster-wide objects
# (CRDs, RBAC, the GatewayClass), which the "lab" project forbids for apps.
#
#   gateway-api   the Gateway API CRDs (Gateway, HTTPRoute, ...), standard channel
#   traefik       the Gateway API controller, and the shared Gateway "gateway/public"
#   keda          event-driven autoscaling (e.g. a Kafka consumer on its lag)
#   kyverno       policy engine: guard rails and per-namespace defaults
#   policies      our policies (platform/policies), applied by Kyverno
#   crossplane    databases, roles (and later topics) declared by apps as objects
#                 in their namespace, created by providers (golden path layer 6)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
spec:
  description: Shared platform components (entry point, autoscaling, policies)
  sourceRepos:
    - git@github.com:DEVOPS-CANARY/GitOps-Repo.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://github.com/traefik/traefik-helm-chart.git
    - https://github.com/kedacore/charts.git
    - ghcr.io/kyverno/charts
    - https://charts.crossplane.io/stable
  destinations:
    - server: https://kubernetes.default.svc
      namespace: gateway
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: crossplane-system
    # KEDA's metrics server needs one RoleBinding here, to read the API
    # server's client-auth settings (standard for any metrics API server).
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io # Gateway API's safe-upgrade policy
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: apiregistration.k8s.io # KEDA serves the external metrics API
      kind: APIService
    - group: admissionregistration.k8s.io # KEDA checks ScaledObjects on create
      kind: ValidatingWebhookConfiguration
    - group: policies.kyverno.io # our policies (platform/policies)
      kind: GeneratingPolicy
    - group: policies.kyverno.io
      kind: ValidatingPolicy
    - group: pkg.crossplane.io # provider packages and their pod settings
      kind: Provider
    - group: pkg.crossplane.io
      kind: DeploymentRuntimeConfig
    - group: postgresql.sql.m.crossplane.io # the lab Postgres, shared by all apps
      kind: ClusterProviderConfig
---
# Gateway API v1.6.3: the version Traefik 3.7 supports. Straight from the
# Kubernetes project's repo at that tag, so an upgrade is one line here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: false # never delete CRDs automatically: that deletes every route with them
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the CRDs are too large for client-side apply
---
# Chart v41.7.1 = Traefik v3.7.14. Later patches (3.7.15, 3.7.16) fix CVEs in
# ForwardAuth and the ingress-nginx provider, which are not enabled here; move
# up once a release has been public for two weeks.
#
# The chart comes from Traefik's Git repo at the release tag: the same files
# as its Helm repo, which is on github.io and unreachable from our network
# (G43). A fresh cluster could not install Traefik at all on 25 Oct.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
spec:
  project: platform
  sources:
    - repoURL: https://github.com/traefik/traefik-helm-chart.git
      path: traefik
      targetRevision: v41.7.1
      helm:
        releaseName: traefik
        skipCrds: true # Traefik's own CRDs: unused, we only use Gateway API
        valueFiles:
          - $values/platform/traefik/values.yaml
    - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The Gateway can only be created once the gateway-api CRDs exist; on a
    # fresh cluster the first attempt fails and a retry succeeds.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
---
# KEDA v2.21.0 (fixes CVE-2026-77524, critical). Apps describe what drives
# their replica count (e.g. Kafka consumer lag) in a ScaledObject; KEDA
# measures it and hands the number to a normal HorizontalPodAutoscaler.
#
# The chart comes from KEDA's Git repo at the release tag: the same files as
# its Helm repo, which is on github.io and was unreachable from our network
# on 24 Oct 2026 (github.com was fine).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
spec:
  project: platform
  sources:
    - repoURL: https://github.com/kedacore/charts.git
      targetRevision: v2.21.0
      path: keda
      helm:
        releaseName: keda
        valueFiles:
          - $values/platform/keda/values.yaml
    - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  # The operator makes its own TLS certificates and writes their CA into these
  # two objects at runtime. That is expected, not drift.
  ignoreDifferences:
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers:
        - /spec/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the ScaledJob CRD is too large for client-side apply
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
---
# Kyverno v1.19.1 (chart 3.9.1): the policy engine. Installed exactly as its
# Argo CD notes recommend: server-side apply and diff (the CRDs are large and
# Kyverno mutates its own objects), and config.preserve off (values file).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/kyverno/charts
      chart: kyverno
      targetRevision: 3.9.2
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/platform/kyverno/values.yaml
    - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # Kyverno fills its aggregated ClusterRoles at runtime; not drift.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jqPathExpressions:
        - .rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
---
# Our policies, plain YAML in platform/policies/. Sync wave 1: Kyverno's CRDs
# must exist first (and a retry covers a fresh cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
    targetRevision: main
    path: platform/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
---
# Crossplane 2.4: the control plane that turns declared Roles, Databases and
# Topics into real ones. Core only; providers are in the next Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
spec:
  project: platform
  sources:
    - repoURL: https://charts.crossplane.io/stable
      chart: crossplane
      targetRevision: 2.4.3
      helm:
        releaseName: crossplane
        valueFiles:
          - $values/platform/crossplane/values.yaml
    - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
---
# The providers and the connections they use: provider-sql and the lab
# Postgres admin connection (sealed). Each kind only exists once Crossplane
# (above) and then the provider have installed their CRDs, hence the retries
# and the dry-run skip.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-config
spec:
  project: platform
  source:
    repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
    targetRevision: main
    path: platform/crossplane/config
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
    syncOptions:
      - SkipDryRunOnMissingResource=true
