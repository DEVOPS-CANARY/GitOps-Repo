# One Argo CD Application per product per environment, found from the folders:
#   apps/logistics/envs/uat/values.yaml -> Application "logistics-uat",
#                                          deployed to namespace "logistics-uat"
# Adding a product or an environment is adding a folder; no Argo config changes.
#
# Each Application has three sources:
#   1. the platform chart rssb-app, at the version the env's values file pins
#      (chart.version), with two values files: the product's shared
#      apps/<product>/values.yaml, then the env's own file on top
#   2. this repo, referenced as $values so the chart can read those files
#   3. the secrets/ folder next to the values file (sealed secrets, plain YAML)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lab-environments
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
        revision: main
        files:
          - path: apps/*/envs/*/values.yaml
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        product: '{{ index .path.segments 1 }}'
        env: '{{ .path.basename }}'
    spec:
      project: lab
      sources:
        - repoURL: ghcr.io/devops-canary/charts
          chart: rssb-app
          targetRevision: '{{ .chart.version }}'
          helm:
            releaseName: '{{ index .path.segments 1 }}'
            valueFiles:
              - '$values/apps/{{ index .path.segments 1 }}/values.yaml'
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
          targetRevision: main
          ref: values
        - repoURL: git@github.com:DEVOPS-CANARY/GitOps-Repo.git
          targetRevision: main
          path: '{{ .path.path }}/secrets'
      destination:
        server: https://kubernetes.default.svc
        # A namespace per product per environment: products never collide on
        # names, and quotas, RBAC and network policies can be set per product.
        namespace: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true    # objects deleted from Git are deleted from the cluster
          selfHeal: true # manual kubectl edits are reverted to what Git says
        # A failed sync is not retried for the same commit unless asked to.
        # Retry with backoff so transient failures (e.g. the database not
        # accepting connections yet when migrations run) recover without a human.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            # Selected on by environment-wide policies (quotas, network walls).
            product: '{{ index .path.segments 1 }}'
            env: '{{ .path.basename }}'
            # Pod Security Admission: reject pods that run as root, escalate
            # privileges, or keep Linux capabilities.
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
