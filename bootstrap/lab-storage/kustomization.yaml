# LAB ONLY: node-local volumes that work on a multi-node minikube.
# minikube's default "standard" class creates root-owned host folders and
# ignores fsGroup, so non-root databases (required by the "restricted" Pod
# Security level) cannot write to them. local-path creates each volume on the
# node that runs the pod, writable by the pod's user.
# On MicroK8s this is replaced by its own storage (hostpath-storage, or
# Longhorn/OpenEBS for multi-node HA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
