    env:
      ALLOWED_ORIGINS: http://uat.todo.local

  frontend:
    image:
      repository: ghcr.io/devops-canary/todo-frontend
      digest: sha256:80ed6608f12775b6ef2d3c8cc967198d8081e48429c808faf4a805c8afb948c2 # develop@986101a tree-1a83cf0b
