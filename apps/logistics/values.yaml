# Logistics: what is the same in every environment, deployed with the platform
# chart rssb-app. Each environment adds envs/<env>/values.yaml on top (Helm
# merges maps key by key; a list in the env file replaces the whole list).
#
# Here: how the app is built and wired. In the env files: the chart version,
# which image runs (repository + digest, written by CI), the host and the
# settings that differ per environment.
# Chart defaults: DEVOPS-CANARY/helm-charts/charts/rssb-app/values.yaml

partOf: logistics

global:
  imagePullSecrets: [ghcr-pull]

components:
  backend:
    type: nestjs
    port: 3001
    # 2 replicas: WebSocket events and rate limits are shared through Redis
    # (readiness rule A7; proven in UAT). The chart adds a PodDisruptionBudget,
    # so a node drain never takes both down.
    replicas: 2
    env:
      NODE_ENV: production
      PORT: "3001"
      # Kafka (lab: in lab-services, outside the cluster). UAT declares its
      # user and topic (kafka.managed in envs/uat, chart 0.7); staging and prod
      # still seal KAFKA_PASSWORD and set KAFKA_USERNAME until they move too.
      KAFKA_BROKERS: host.minikube.internal:19092
    secretRefs: [backend-secrets]
    ingress:
      enabled: true
      path: /api
      stripPrefix: true
      longLivedConnections: true # live tracking over Socket.io
    migration:
      enabled: true
      command: [node, node_modules/prisma/build/index.js, migrate, deploy]

  frontend:
    type: nextjs
    port: 3000
    probes:
      startup: { path: /login }
      liveness: { path: /login }
      readiness: { path: /login }

  # Reads tracking events from Kafka and sends one notification per event
  # (simulated: recorded as NOTIFICATION_SENT in the audit log). It's the
  # backend image with another command. Each environment pins the digest; CI
  # writes it on every line naming the backend image, so it matches the backend.
  notifications:
    type: worker
    command: [node, dist/worker.js]
    secretRefs: [notifications-secrets] # DATABASE_URL (+ KAFKA_PASSWORD where not managed)
    env:
      NODE_ENV: production
      KAFKA_BROKERS: host.minikube.internal:19092
      # LAB: each notification "takes" 200 ms (stands in for an email or SMS
      # call), so a burst of events builds visible consumer lag for KEDA.
      NOTIFY_DELAY_MS: "200"
    # KEDA sizes the worker on its consumer group's lag: about one pod per 20
    # waiting messages, 1 to 6 (the topic has 6 partitions; a 7th consumer
    # would have none to read). Each environment names its topic and group.
    autoscaling:
      enabled: true
      metric: kafka
      minReplicas: 1
      maxReplicas: 6
      kafka:
        offsetResetPolicy: earliest # the worker reads a new group from the start
