apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backend-secrets.sealed.yaml
  - ghcr-pull.sealed.yaml

# The exact images running in UAT, pinned by digest (immutable, unlike tags).
# CI rewrites these lines on every merge to develop.
images:
  - name: ghcr.io/princebabou/logistics-backend
    digest: sha256:1a3f76960f23c0b98faee0c622113fc6552b892ab64dc8e22f7cfdf1698dcbea # sha-ef366aa tree-124a310d
  - name: ghcr.io/princebabou/logistics-frontend
    digest: sha256:26b77f9fd08d5450c3cf28df367d13a69d927b506215980db9e2dee50ecc9bbc # sha-ef366aa tree-124a310d

# Non-secret config. The name gets a content hash, so changing a value
# changes the Deployment spec and rolls the pods automatically.
configMapGenerator:
  - name: backend-config
    literals:
      - NODE_ENV=production
      - PORT=3001
      - ALLOWED_ORIGINS=http://uat.logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      - JWT_ISSUER=logistics-api-uat
      - JWT_AUDIENCE=logistics-web-uat

patches:
  # Secrets must exist before the migration Job (wave -1) and the apps (wave 0).
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: uat.logistics.local
