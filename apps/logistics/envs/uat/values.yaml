# Logistics in UAT. Deployed on every merge to the app's develop branch.
# Shared settings: ../../values.yaml. Image digests are written by CI.

chart:
  version: 0.7.0 # rssb-app chart version for this environment (read by Argo CD)

global:
  host: uat.logistics.local

components:
  backend:
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:82a7402773d9fd43ca283dd2ceeb903d64cef8a70da00034cfdebc5f91a64b1c # develop@692ff07 tree-0fa67dcb
    env:
      ALLOWED_ORIGINS: http://uat.logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      # Different per environment, so a UAT token is refused by staging and prod.
      JWT_ISSUER: logistics-api-uat
      JWT_AUDIENCE: logistics-web-uat
      # Redis (REDIS_URL is sealed in backend-secrets): every key and channel
      # starts with this, the only prefix this environment's Redis user may use.
      REDIS_KEY_PREFIX: "logistics:uat:"
    # Its own Kafka user (logistics_uat, fenced to uat.logistics.* by ACLs) and
    # the topic it produces to, created by the platform (Crossplane
    # provider-kafka). The generated credentials reach the pods as
    # KAFKA_USERNAME/PASSWORD/BROKERS, the prefix as KAFKA_TOPIC_PREFIX:
    # nothing sealed, nothing scripted. Needs chart 0.7.
    kafka:
      managed: true
      topics:
        - { name: tracking-events, partitions: 6 } # one per consumer at most (notifications maxReplicas)

  frontend:
    image:
      repository: ghcr.io/devops-canary/logistics-frontend
      digest: sha256:71146bfaaaa8ae8e784789b3c59465450048c2a714f8834919a4530c27230a8e # develop@692ff07 tree-0fa67dcb
    replicas: 2

  notifications: # the worker: shared settings in ../../values.yaml
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:82a7402773d9fd43ca283dd2ceeb903d64cef8a70da00034cfdebc5f91a64b1c # develop@692ff07 tree-0fa67dcb
    kafka:
      existingSecret: backend-kafka # the backend's user and prefix, same variables
    autoscaling: # KEDA lag scaling: shared settings in ../../values.yaml
      kafka:
        topic: uat.logistics.tracking-events
        consumerGroup: uat.logistics.notifications
