# Logistics in UAT. Deployed on every merge to the app's develop branch.
# Shared settings: ../../values.yaml. Image digests are written by CI.

chart:
  version: 0.4.0 # rssb-app chart version for this environment (read by Argo CD)

global:
  host: uat.logistics.local

components:
  backend:
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:e73c3c49ae016077e6b1058ee9f71b4c73eb82c70587c34c9866ab4d7b832367 # develop@3608cf7 tree-fcc53170
    env:
      ALLOWED_ORIGINS: http://uat.logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      # Different per environment, so a UAT token is refused by staging and prod.
      JWT_ISSUER: logistics-api-uat
      JWT_AUDIENCE: logistics-web-uat
      # Redis (REDIS_URL is sealed in backend-secrets): every key and channel
      # starts with this, the only prefix this environment's Redis user may use.
      REDIS_KEY_PREFIX: "logistics:uat:"
      # Kafka: this user may only use topics and consumer groups starting with
      # the prefix (KAFKA_PASSWORD is sealed in backend-secrets).
      KAFKA_USERNAME: logistics_uat
      KAFKA_TOPIC_PREFIX: uat.logistics.
    # 2 replicas: WebSocket events and rate limits are shared through Redis
    # (the image has the Redis adapter since develop@0416c8b). The chart adds a
    # PodDisruptionBudget, so a node drain never takes both down.
    replicas: 2

  frontend:
    image:
      repository: ghcr.io/devops-canary/logistics-frontend
      digest: sha256:71146bfaaaa8ae8e784789b3c59465450048c2a714f8834919a4530c27230a8e # develop@3608cf7 tree-fcc53170
    replicas: 2

  # Reads tracking events from Kafka and sends one notification per event
  # (simulated: recorded as NOTIFICATION_SENT in the audit log). It's the
  # backend image with another command: CI writes the new digest on every line
  # naming this image, so the worker always runs the same build as the backend.
  notifications:
    type: worker
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:e73c3c49ae016077e6b1058ee9f71b4c73eb82c70587c34c9866ab4d7b832367 # develop@3608cf7 tree-fcc53170
    command: [node, dist/worker.js]
    secretRefs: [notifications-secrets] # DATABASE_URL + KAFKA_PASSWORD only
    env:
      NODE_ENV: production
      KAFKA_BROKERS: host.minikube.internal:19092
      KAFKA_USERNAME: logistics_uat
      KAFKA_TOPIC_PREFIX: uat.logistics.
      # LAB: each notification "takes" 200 ms, so a burst of events builds a
      # visible backlog (consumer lag) for the KEDA demo.
      NOTIFY_DELAY_MS: "200"

