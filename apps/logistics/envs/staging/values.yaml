# Logistics in Staging. Deployed on every merge to the app's staging branch,
# with the image already built and run in UAT (found by its tree tag, never rebuilt).
# Shared settings: ../../values.yaml. Image digests are written by CI.

chart:
  version: 0.2.1 # rssb-app chart version for this environment (read by Argo CD)

global:
  host: staging.logistics.local

components:
  backend:
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:a318dfddf1f9beae569cf1671d1c3ffb5453316e3acf2efcf4912bd38872459a # staging@f78b85c tree-4d6df0c4
    env:
      ALLOWED_ORIGINS: http://staging.logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      # Different per environment, so a UAT token is refused by staging and prod.
      JWT_ISSUER: logistics-api-staging
      JWT_AUDIENCE: logistics-web-staging

  frontend:
    image:
      repository: ghcr.io/devops-canary/logistics-frontend
      digest: sha256:38eccfdb104448a113a1fb9165aa462b4e1ba38aad6d233fc662ba90b331b46b # staging@f78b85c tree-4d6df0c4
    replicas: 1
