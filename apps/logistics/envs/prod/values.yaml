# Logistics in production. Deployed by the approved Release workflow on the
# app's main branch, and only with the digest that Staging is running.
# Two frontend replicas: the chart adds a PodDisruptionBudget, so a node drain
# never takes both down.
# Shared settings: ../../values.yaml. Image digests are written by CI.

chart:
  version: 0.4.0 # rssb-app chart version for this environment (read by Argo CD)

global:
  host: logistics.local

components:
  backend:
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:e73c3c49ae016077e6b1058ee9f71b4c73eb82c70587c34c9866ab4d7b832367 # main@3058acb tree-fcc53170
    env:
      ALLOWED_ORIGINS: http://logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      # Different per environment, so a UAT token is refused by staging and prod.
      JWT_ISSUER: logistics-api-prod
      JWT_AUDIENCE: logistics-web-prod
      # Redis (REDIS_URL is sealed in backend-secrets): every key and channel
      # starts with this, the only prefix this environment's Redis user may use.
      REDIS_KEY_PREFIX: "logistics:prod:"
      # Kafka: this user may only use topics and consumer groups starting with
      # the prefix (KAFKA_PASSWORD is sealed in backend-secrets).
      KAFKA_USERNAME: logistics_prod
      KAFKA_TOPIC_PREFIX: prod.logistics.

  frontend:
    image:
      repository: ghcr.io/devops-canary/logistics-frontend
      digest: sha256:71146bfaaaa8ae8e784789b3c59465450048c2a714f8834919a4530c27230a8e # main@3058acb tree-fcc53170
    replicas: 2

  notifications: # the worker: shared settings in ../../values.yaml
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:e73c3c49ae016077e6b1058ee9f71b4c73eb82c70587c34c9866ab4d7b832367 # main@3058acb tree-fcc53170
    env:
      KAFKA_USERNAME: logistics_prod
      KAFKA_TOPIC_PREFIX: prod.logistics.

