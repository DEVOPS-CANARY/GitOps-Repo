# Logistics in production. Deployed by the approved Release workflow on the
# app's main branch, and only with the digest that Staging is running.
# Two frontend replicas: the chart adds a PodDisruptionBudget, so a node drain
# never takes both down.
# Shared settings: ../../values.yaml. Image digests are written by CI.

chart:
  version: 0.3.0 # rssb-app chart version for this environment (read by Argo CD)

global:
  host: logistics.local

components:
  backend:
    image:
      repository: ghcr.io/devops-canary/logistics-backend
      digest: sha256:a318dfddf1f9beae569cf1671d1c3ffb5453316e3acf2efcf4912bd38872459a # main@7c703c9 tree-20779183
    env:
      ALLOWED_ORIGINS: http://logistics.local
      # Required in practice: the app passes these straight to jsonwebtoken,
      # which rejects an undefined issuer, so login fails when they are unset.
      # Different per environment, so a UAT token is refused by staging and prod.
      JWT_ISSUER: logistics-api-prod
      JWT_AUDIENCE: logistics-web-prod

  frontend:
    image:
      repository: ghcr.io/devops-canary/logistics-frontend
      digest: sha256:71146bfaaaa8ae8e784789b3c59465450048c2a714f8834919a4530c27230a8e # main@7c703c9 tree-20779183
    replicas: 2
