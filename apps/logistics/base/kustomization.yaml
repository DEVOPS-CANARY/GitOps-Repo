# Environment-independent manifests. Each envs/<env> overlay supplies the image
# digests, config, secrets and host name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: logistics
    includeSelectors: false
resources:
  - backend.yaml
  - frontend.yaml
  - migrate-job.yaml
  - ingress.yaml
