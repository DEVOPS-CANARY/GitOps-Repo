# Database migrations, run by Argo CD on every sync BEFORE the new pods roll out.
#
# Ordering within a sync (lower waves first, each must be healthy before the next):
#   wave -2  SealedSecrets (unsealed into Secrets)   - set in the env overlay
#   wave -1  this Job (Sync hook: runs to completion)
#   wave  0  Deployments, Services, Ingress
# If the migration fails, the sync stops and the old version keeps running.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6 # retries cover the DB still starting on a fresh environment
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/devops-canary/logistics-backend # same image (and digest) as the app
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
