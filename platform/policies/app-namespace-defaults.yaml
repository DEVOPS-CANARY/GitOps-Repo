# Every app namespace (labelled "product" by the ApplicationSet) gets these
# objects automatically, the moment the namespace exists, and Kyverno keeps
# them in place (synchronize): a hand edit or deletion is undone.
#
#   Network walls   nothing in, nothing out, except: the gateway (Traefik) may
#                   reach the app's pods; pods in the same namespace may talk
#                   to each other; DNS; and anything outside the cluster (the
#                   databases, Redis and Kafka on their VMs). One app can never
#                   reach another app's pods, nor platform pods.
#   Quota           a ceiling per namespace, so one app can't starve the others.
#   LimitRange      defaults for pods that forget to ask (the chart always
#                   does), so the quota can be enforced on every pod.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: app-namespace-defaults
  annotations:
    policies.kyverno.io/title: Default walls, quota and limits for app namespaces
    policies.kyverno.io/description: >-
      Generates default-deny NetworkPolicies with the allowed exceptions, a
      ResourceQuota and a LimitRange in every namespace labelled "product".
spec:
  generateExisting: true # existing app namespaces get them too, not only new ones
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Ingress, Egress]

    - name: allow-same-namespace
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-same-namespace
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Ingress, Egress]
            ingress:
              - from:
                  - podSelector: {}
            egress:
              - to:
                  - podSelector: {}

    - name: allow-from-gateway
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-from-gateway
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Ingress]
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: gateway

    - name: allow-dns
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-dns
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Egress]
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - { protocol: UDP, port: 53 }
                  - { protocol: TCP, port: 53 }

    # Databases, Redis and Kafka live outside the cluster (on VMs at RSSB, in
    # Docker in the lab), so egress to anything that is not a pod or a
    # Service is allowed. The firewall around those VMs is RSSB's wall.
    - name: allow-outside-cluster
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      context:
        - name: settings
          configMap:
            name: platform-settings
            namespace: kyverno
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-outside-cluster
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: [Egress]
            egress:
              - to:
                  - ipBlock:
                      cidr: 0.0.0.0/0
                      except:
                        - "{{ settings.data.podCIDR }}"
                        - "{{ settings.data.serviceCIDR }}"

    - name: quota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: app-quota
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "8"
              limits.memory: 16Gi
              pods: "40"

    - name: limits
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - { key: product, operator: Exists }
      generate:
        apiVersion: v1
        kind: LimitRange
        name: app-limits
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            limits:
              - type: Container
                defaultRequest: { cpu: 50m, memory: 64Mi }
                default: { cpu: 500m, memory: 256Mi }
                max: { cpu: "2", memory: 2Gi }
