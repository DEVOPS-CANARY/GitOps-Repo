# Crossplane core (chart crossplane, charts.crossplane.io/stable), sized for the lab.
# Providers are declared in config/ (installed by Crossplane itself, not by Helm).
resourcesCrossplane:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
# The RBAC manager renews a 15 s leader lease; throttled at the chart's 100m
# it lost it on this laptop's slow API server and crash-looped.
resourcesRBACManager:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
# Pod Security "restricted" on the namespace: non-root, no privilege
# escalation, no capabilities, default seccomp.
securityContextCrossplane:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }
securityContextRBACManager:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }
