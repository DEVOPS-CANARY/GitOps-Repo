# Provider pods must satisfy Pod Security "restricted" like every other pod
# here; Crossplane's default provider pod spec lacks the seccomp profile and
# the dropped capabilities. `package-runtime` is the provider's container name.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: package-runtime
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
